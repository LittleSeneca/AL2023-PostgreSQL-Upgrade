- name: Unmount Backup Volume
  ansible.builtin.mount:
    path: "{{ backup_dir }}"
    state: absent

- name: Get Instance ID
  ansible.builtin.shell:
    cmd: "ec2-metadata -i | awk '{print $2}'"
  register: instance_id
  changed_when: false
  when: true

- name: Get Region
  ansible.builtin.shell:
    cmd: "ec2-metadata -R | awk '{print $2}'"
  register: region
  changed_when: false
  when: true

- name: Find attached backup volume
  amazon.aws.ec2_vol_info:
    region: "{{ region.stdout }}"
    filters:
      attachment.instance-id: "{{ instance_id.stdout }}"
      "tag:Name": "backup-migration"
  register: volumes_info

- name: Display volumes found
  ansible.builtin.debug:
    var: volumes_info

- name: Remove Backup Volume
  amazon.aws.ec2_vol:
    id: "{{ item.id }}"
    region: "{{ region.stdout }}"
    state: absent
  with_items: "{{ volumes_info.volumes }}"
  when: volumes_info.volumes | length > 0

- name: Remove Docker
  ansible.builtin.dnf:
    name: docker
    state: absent

- name: Remove Docker-Compose
  ansible.builtin.file:
    path: "/usr/local/lib/docker"
    state: absent
